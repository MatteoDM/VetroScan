<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- HP Scanjet 3770 app icon: a flatbed scanner, lid raised, light bar
       across the glass. GPL-2.0-or-later, as the rest of the project. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ca3af"/>
      <stop offset="1" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- lid, raised -->
  <path d="M22 58 L32 18 Q33 14 37 14 L91 14 Q95 14 96 18 L106 58 Z" fill="url(#lid)"/>
  <path d="M30 54 L38 22 L90 22 L98 54 Z" fill="#f3f4f6" opacity="0.9"/>
  <!-- body -->
  <rect x="10" y="56" width="108" height="50" rx="10" fill="url(#body)"/>
  <!-- glass -->
  <rect x="20" y="62" width="88" height="24" rx="4" fill="#0f172a"/>
  <!-- light bar -->
  <rect x="20" y="71" width="88" height="6" rx="2" fill="url(#beam)"/>
  <!-- buttons -->
  <circle cx="84" cy="96" r="3.5" fill="#60a5fa"/>
  <circle cx="95" cy="96" r="3.5" fill="#9ca3af"/>
  <circle cx="106" cy="96" r="3.5" fill="#9ca3af"/>
  <!-- foot shadow -->
  <rect x="16" y="106" width="96" height="4" rx="2" fill="#000" opacity="0.18"/>
</svg>
