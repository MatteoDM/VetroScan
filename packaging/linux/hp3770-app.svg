<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- HP Scanjet 3770 app icon: a photo under the scanner's light bar, in
       colour where the light has passed, still grey below it.
       GPL-2.0-or-later, as the rest of the project. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0b1b4a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a5f3fc" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.28"/>
    </linearGradient>
    <clipPath id="above">
      <rect x="262" y="214" width="500" height="372"/>
    </clipPath>
    <clipPath id="below">
      <rect x="262" y="586" width="500" height="234"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sheen)"/>

  <!-- the photo print: white border, picture inside -->
  <rect x="234" y="186" width="556" height="662" rx="30" fill="#f8fafc" filter="url(#shadow)"/>

  <!-- scanned: in colour -->
  <g clip-path="url(#above)">
    <rect x="262" y="214" width="500" height="606" fill="url(#sky)"/>
    <circle cx="642" cy="322" r="56" fill="#fde047"/>
    <path d="M262 820 L262 500 L392 362 L478 450 L572 340 L762 548 L762 820 Z" fill="#10b981"/>
    <path d="M262 820 L262 560 L370 486 L456 560 L548 494 L668 584 L762 528 L762 820 Z" fill="#047857"/>
  </g>
  <!-- not scanned yet: grey -->
  <g clip-path="url(#below)">
    <rect x="262" y="214" width="500" height="606" fill="#e2e8f0"/>
    <path d="M262 820 L262 500 L392 362 L478 450 L572 340 L762 548 L762 820 Z" fill="#cbd5e1"/>
    <path d="M262 820 L262 560 L370 486 L456 560 L548 494 L668 584 L762 528 L762 820 Z" fill="#94a3b8"/>
    <!-- the rows of a page, still to come -->
    <rect x="312" y="664" width="400" height="26" rx="13" fill="#f1f5f9"/>
    <rect x="312" y="716" width="300" height="26" rx="13" fill="#f1f5f9"/>
  </g>
  <!-- a faint light over what was just scanned -->
  <rect x="262" y="470" width="500" height="116" fill="url(#trail)"/>

  <!-- the light bar, wider than the print -->
  <rect x="150" y="530" width="724" height="112" fill="url(#glow)"/>
  <rect x="150" y="574" width="724" height="24" rx="12" fill="#ecfeff"/>
</svg>
