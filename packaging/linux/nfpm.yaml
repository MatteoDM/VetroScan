# nFPM configuration for the .deb, .rpm and Arch (pacman) packages, built by scripts/package.sh:
#   APP_VERSION=0.1.0 APP_ARCH=amd64 \
#     nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/vetroscan.deb
# Paths are relative to the repository root, where the script runs nfpm. nFPM does not expand
# variables in paths, so the script copies the binaries to target/package first.
#
# The binaries only link libc: windowing (Wayland/X11), keyboard maps and Vulkan/OpenGL are
# loaded at run time, so they are declared here as dependencies. The "Save" dialog goes through
# the desktop portal, and the Copy button prints with CUPS's lp: recommended, not required.
#
# The udev rule lets the user at the seat open the scanner without root. postinstall.sh reloads
# the rules and applies them to a scanner already plugged in.
name: vetroscan
version: ${APP_VERSION}
arch: ${APP_ARCH}
platform: linux
section: graphics
priority: optional
maintainer: Matteo Dal Molin <matteodalmo@gmail.com>
description: |
  VetroScan: desktop scanning app for documents, photos and films, with free drivers
  for the HP Scanjet 3770 and the Epson Perfection 4490 Photo.
  Talks to the scanners directly over USB, without SANE or kernel modules.
homepage: https://github.com/MatteoDM/VetroScan
license: GPL-2.0-or-later
# The AUR package built from git installs the same files.
# Before v0.3.0 the package was called hp3770: the new one takes its place.
conflicts:
  - hp3770
  - hp3770-git
  - vetroscan-git
replaces:
  - hp3770
provides:
  - hp3770

contents:
  - src: target/package/vetroscan
    dst: /usr/bin/vetroscan
    file_info:
      mode: 0755
  - src: target/package/hp3770
    dst: /usr/bin/hp3770
    file_info:
      mode: 0755
  - src: packaging/linux/70-hp3770.rules
    dst: /usr/lib/udev/rules.d/70-hp3770.rules
  - src: packaging/linux/70-epson-4490.rules
    dst: /usr/lib/udev/rules.d/70-epson-4490.rules
  - src: packaging/linux/vetroscan.desktop
    dst: /usr/share/applications/vetroscan.desktop
  - src: packaging/linux/vetroscan.svg
    dst: /usr/share/icons/hicolor/scalable/apps/vetroscan.svg
  - src: packaging/icons/vetroscan-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/vetroscan.png
  - src: packaging/icons/vetroscan-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/vetroscan.png
  - src: packaging/icons/vetroscan-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/vetroscan.png
  - src: README.md
    dst: /usr/share/doc/vetroscan/README.md
  - src: LICENSE
    dst: /usr/share/licenses/vetroscan/LICENSE
  # Written by scripts/third_party_licenses.sh, which scripts/package.sh runs first.
  - src: target/package/THIRD_PARTY_LICENSES.txt
    dst: /usr/share/licenses/vetroscan/THIRD_PARTY_LICENSES.txt

scripts:
  postinstall: packaging/linux/postinstall.sh
  postremove: packaging/linux/postremove.sh

overrides:
  deb:
    depends:
      - libxkbcommon0
      - libwayland-client0
      - libvulkan1 | libegl1
    recommends:
      - xdg-desktop-portal
      - cups-client
  rpm:
    depends:
      - libxkbcommon
      - libwayland-client
      - (vulkan-loader or mesa-libEGL)
    recommends:
      - xdg-desktop-portal
      - cups-client
  archlinux:
    depends:
      - libxkbcommon
      - wayland
      - vulkan-icd-loader
      - xdg-desktop-portal
