# cargo-about configuration: the license notices of every crate built into the app and the
# hp3770 command, written to THIRD_PARTY_LICENSES.txt by scripts/third_party_licenses.sh. Keep
# `accepted` in step with [licenses] allow in deny.toml.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Only what ends up in the binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The project's own crates (publish = false): their license is LICENSE.
private = { ignore = true }
