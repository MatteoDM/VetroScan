[package]
name = "vetroscan"
description = "VetroScan: desktop scanning application for documents, photos and films (HP Scanjet 3770, Epson Perfection 4490 Photo)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
hp3770-core.workspace = true
scan-imaging.workspace = true
scanner-api.workspace = true
hp3770-usb.workspace = true
epson-gt-x750.workspace = true
iced = { version = "0.14", features = ["image", "canvas", "tokio"] }
rfd = "0.18"
notify-rust = "4"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The local date and time in the names of saved files.
jiff = "1"
vetroscan-export.workspace = true
sys-locale = "0.3"
# The screen's colours (phase 14): Firefox's colour management, pure Rust.
qcms = { version = "0.3", default-features = false, features = ["iccv4-enabled"] }

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "vetroscan"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
iced_test = "0.14"
iced_runtime = "0.14"

