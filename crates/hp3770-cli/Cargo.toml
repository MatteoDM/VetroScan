[package]
name = "hp3770-cli"
description = "Command line tool for the HP Scanjet 3770"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
hp3770-core.workspace = true
scan-imaging.workspace = true
scanner-api.workspace = true
hp3770-usb.workspace = true
clap = { version = "4.5", features = ["derive"] }
png = "0.18"

[dev-dependencies]
# Only for the development tools in examples/.
hp3770-capture.workspace = true

[[bin]]
name = "hp3770"
path = "src/main.rs"

[lints]
workspace = true
