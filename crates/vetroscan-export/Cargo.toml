[package]
name = "vetroscan-export"
description = "Image, PDF and multi-page export of VetroScan scans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
scan-imaging.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "avif", "bmp", "tiff", "rayon"] }
tiff = "0.11"
png = "0.18"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The example reads the HP 3770 paper white.
hp3770-core.workspace = true

[lints]
workspace = true
