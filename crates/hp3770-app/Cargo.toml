[package]
name = "hp3770-app"
description = "Desktop application for the HP Scanjet 3770"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
hp3770-core.workspace = true
hp3770-usb.workspace = true
iced = { version = "0.14", features = ["image", "canvas", "tokio"] }
rfd = "0.18"
notify-rust = "4"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hp3770-export.workspace = true

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "hp3770-app"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
iced_test = "0.14"
iced_runtime = "0.14"

