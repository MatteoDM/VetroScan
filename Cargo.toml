[workspace]
resolver = "2"
members = [
    "crates/scan-imaging",
    "crates/scanner-api",
    "crates/hp3770-core",
    "crates/hp3770-capture",
    "crates/hp3770-usb",
    "crates/epson-gt-x750",
    "crates/hp3770-cli",
    "crates/vetroscan",
    "crates/vetroscan-export",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/MatteoDM/scanner"
authors = ["Matteo"]

[workspace.dependencies]
scan-imaging = { path = "crates/scan-imaging" }
scanner-api = { path = "crates/scanner-api" }
hp3770-core = { path = "crates/hp3770-core" }
hp3770-usb = { path = "crates/hp3770-usb" }
epson-gt-x750 = { path = "crates/epson-gt-x750" }
hp3770-capture = { path = "crates/hp3770-capture" }
vetroscan-export = { path = "crates/vetroscan-export" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# Images are large: libraries unoptimised make tests (and trying the app
# from a debug build) slow, AVIF and the PNG encoder most of all.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.scan-imaging]
opt-level = 2
[profile.dev.package.hp3770-core]
opt-level = 2
[profile.dev.package.vetroscan-export]
opt-level = 2
