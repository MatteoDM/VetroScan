[workspace]
resolver = "2"
members = [
    "crates/hp3770-core",
    "crates/hp3770-capture",
    "crates/hp3770-usb",
    "crates/hp3770-cli",
    "crates/hp3770-app",
    "crates/hp3770-export",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/MatteoDM/scanner"
authors = ["Matteo"]

[workspace.dependencies]
hp3770-core = { path = "crates/hp3770-core" }
hp3770-usb = { path = "crates/hp3770-usb" }
hp3770-export = { path = "crates/hp3770-export" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# Images are large: libraries unoptimised make tests (and trying the app
# from a debug build) slow, AVIF and the PNG encoder most of all.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.hp3770-core]
opt-level = 2
[profile.dev.package.hp3770-export]
opt-level = 2
