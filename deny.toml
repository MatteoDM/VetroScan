# cargo-deny configuration, checked by .github/workflows/deny.yml.
# Locally: `cargo deny check` (https://embarkstudios.github.io/cargo-deny/).

[graph]
# The platforms the project is released for (see the build matrix in release.yml).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false

[advisories]
# Vulnerabilities always fail. Unmaintained crates fail only when the project depends on them
# directly: the ones below iced, image and rfd are for those projects to replace.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# The project is GPL-2.0-or-later, so it can be distributed under GPL-3.0 together with the
# Apache-2.0 crates. Every license here asks for its notice to ship with the binaries:
# scripts/third_party_licenses.sh collects them into the packages. Keep in step with
# `accepted` in packaging/about.toml.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level copyleft: only changes to those files would have to be published.
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The project's own crates (publish = false): GPL-2.0-or-later, see LICENSE.
ignore = true

[bans]
# iced, wgpu and winit bring two versions of several crates: reported, not an error.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
