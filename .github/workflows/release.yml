name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Stage 1: the release is only built when the tests pass on every platform.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev

      - name: Run tests
        # --no-fail-fast: one failing test binary must not hide the ones after it.
        run: cargo test --workspace --locked --no-fail-fast

  # Formatting and clippy, on Linux only: the cfg(windows) and cfg(macos) code is compiled by
  # the tests above but not linted.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        # Lint levels are in [workspace.lints] in Cargo.toml.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Stage 2: the version in Cargo.toml must match the tag being released.
  prepare:
    name: Prepare release
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Read and verify version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "vetroscan") | .version')
          if [[ "$IS_TAG" == "true" && "$REF_NAME" != "v$version" ]]; then
            echo "Tag $REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Stage 3: binaries for every supported platform.
  build:
    name: Build ${{ matrix.artifact }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform finishes its build and smoke test, so one failure does not hide another.
      # The release job still needs all of them to succeed.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: macos-x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev rpm

      # Pinned versions, checked against their SHA256 before use.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        env:
          NFPM_VERSION: 2.47.0
          APPIMAGETOOL_VERSION: 1.9.1
          # The AppImage runtime too: without it appimagetool downloads the moving "continuous"
          # one, a different file from one release to the next.
          APPIMAGE_RUNTIME_VERSION: "20251108"
        run: |
          tools="$RUNNER_TEMP/packaging-tools"
          mkdir -p "$tools"
          case "$(uname -m)" in
            x86_64)
              nfpm_asset=nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz
              nfpm_sha=0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
              appimage_asset=appimagetool-x86_64.AppImage
              appimage_sha=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
              runtime_asset=runtime-x86_64
              runtime_sha=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
              ;;
            aarch64)
              nfpm_asset=nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz
              nfpm_sha=1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
              appimage_asset=appimagetool-aarch64.AppImage
              appimage_sha=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
              runtime_asset=runtime-aarch64
              runtime_sha=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
              ;;
          esac
          curl -fsSL --retry 5 --retry-all-errors -o "$tools/$nfpm_asset" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$nfpm_asset"
          curl -fsSL --retry 5 --retry-all-errors -o "$tools/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/$appimage_asset"
          curl -fsSL --retry 5 --retry-all-errors -o "$tools/appimage-runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/$runtime_asset"
          echo "$nfpm_sha  $tools/$nfpm_asset" | sha256sum -c -
          echo "$appimage_sha  $tools/appimagetool" | sha256sum -c -
          echo "$runtime_sha  $tools/appimage-runtime" | sha256sum -c -
          tar -xzf "$tools/$nfpm_asset" -C "$tools" nfpm
          chmod +x "$tools/nfpm" "$tools/appimagetool"
          {
            echo "NFPM=$tools/nfpm"
            echo "APPIMAGETOOL=$tools/appimagetool"
            echo "APPIMAGE_RUNTIME=$tools/appimage-runtime"
          } >> "$GITHUB_ENV"

      # For THIRD_PARTY_LICENSES.txt (scripts/third_party_licenses.sh); a prebuilt binary,
      # checked against its published checksum.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Build release binaries
        run: cargo build --release --locked --bin vetroscan --bin hp3770 --target ${{ matrix.target }}

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        run: scripts/package.sh "${{ matrix.target }}" "${{ matrix.artifact }}" "${{ needs.prepare.outputs.version }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/package.ps1 -Target "${{ matrix.target }}" -Version "${{ needs.prepare.outputs.version }}"

      # Each installer is installed and removed again, so a broken package never gets published.
      - name: Smoke test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          # /CURRENTUSER: the per-user install, the one that needs no administrator rights.
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\VetroScan'
          $app = Join-Path $dir 'vetroscan.exe'
          $cli = Join-Path $dir 'hp3770.exe'
          $notices = Join-Path $dir 'THIRD_PARTY_LICENSES.txt'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\VetroScan.lnk'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6B0BD725-4FC5-40CE-A326-BBF50527870C}_is1'
          foreach ($path in @($app, $cli, $notices, $shortcut, $key)) {
            if (-not (Test-Path $path)) { throw "Missing after a per-user install: $path" }
          }
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "hp3770 --version failed with exit code $LASTEXITCODE" }
          $uninstaller = (Get-ItemProperty $key).UninstallString.Trim('"')
          Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands over to a copy of itself in %TEMP%, so wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          foreach ($path in @($app, $cli, $shortcut, $key)) {
            if (Test-Path $path) { throw "Still present after uninstalling: $path" }
          }
          Write-Host "Installed per user and removed cleanly"

      - name: Smoke test the packages (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/vetroscan-*.deb
          test -x /usr/bin/vetroscan
          test -x /usr/bin/hp3770
          hp3770 --version
          test -f /usr/lib/udev/rules.d/70-hp3770.rules
          test -f /usr/share/applications/vetroscan.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/vetroscan.svg
          test -s /usr/share/licenses/vetroscan/THIRD_PARTY_LICENSES.txt
          sudo apt-get remove -y vetroscan
          test ! -e /usr/bin/vetroscan
          # Listings go to files first: `cmd | grep -q` stops reading at the first match, and
          # with pipefail the writer's broken pipe would fail the step.
          listing="$RUNNER_TEMP/listing.txt"
          rpm -qlp dist/vetroscan-*.rpm > "$listing"
          grep -qx /usr/bin/vetroscan "$listing"
          grep -qx /usr/lib/udev/rules.d/70-hp3770.rules "$listing"
          tar --zstd -tf dist/vetroscan-*.pkg.tar.zst > "$listing"
          grep -qx usr/bin/vetroscan "$listing"
          grep -qx usr/lib/udev/rules.d/70-hp3770.rules "$listing"
          appimage=$(realpath dist/vetroscan-*.AppImage)
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null \
            && test -x squashfs-root/usr/bin/vetroscan && test -x squashfs-root/usr/bin/hp3770 \
            && test -f squashfs-root/vetroscan.desktop \
            && test -s squashfs-root/usr/share/licenses/vetroscan/THIRD_PARTY_LICENSES.txt)
          echo "deb installed and removed; rpm, pacman and AppImage contents checked"

      - name: Smoke test the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/vetroscan-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/vetroscan-*.dmg
          test -x "$mount/VetroScan.app/Contents/MacOS/vetroscan"
          test -x "$mount/VetroScan.app/Contents/MacOS/hp3770"
          test -s "$mount/VetroScan.app/Contents/Resources/THIRD_PARTY_LICENSES.txt"
          test -f "$mount/VetroScan.app/Contents/Resources/icon.icns"
          test -L "$mount/Applications"
          codesign --verify "$mount/VetroScan.app"
          hdiutil detach "$mount"
          echo "dmg mounts with a signed app and an Applications link"

      - uses: actions/upload-artifact@v5
        with:
          name: vetroscan-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Stage 4: publish on tags only. Manual runs keep the artifacts without publishing.
  release:
    name: Publish GitHub release
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: vetroscan-*
          merge-multiple: true
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum vetroscan-* > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          # The CHANGELOG.md section for this version, without its heading, becomes the notes.
          awk -v version="${TAG#v}" '
            /^## \[/ { if (found) exit; found = index($0, "[" version "]") > 0; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for ${TAG#v}" >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "VetroScan $TAG" --notes-file notes.md \
              --verify-tag "${prerelease[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
